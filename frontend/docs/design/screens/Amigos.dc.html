<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Amigos — ¿Jalas?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F8}
a{color:#3D3BD4}a:hover{color:#2B29A8}
input::placeholder{color:#8A8A96}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 36px 22px 0; background: #F6F6F8; color: #111114; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

  <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.8px">Tu banda</h1>

  <label style="position: relative; display: block">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar por usuario</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111114" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" placeholder="Busca por @usuario" style="width: 100%; height: 48px; border-radius: 14px; border: 1px solid rgba(17, 17, 20, 0.08); background: #FFFFFF; color: #111114; padding: 0 16px 0 42px; font-size: 16px; font-family: inherit; box-sizing: border-box">
  </label>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="height: 46px; border-radius: 14px; border: 1px solid rgba(17, 17, 20, 0.08); background: #FFEDB8; color: #111114; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 6px 18px rgba(17, 17, 20, 0.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      Mi link
    </button>
    <button type="button" style="height: 46px; border-radius: 14px; border: 1px solid rgba(17, 17, 20, 0.08); background: #CDEFDF; color: #111114; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 6px 18px rgba(17, 17, 20, 0.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-4M14 21v-3"/></svg>
      Mi QR
    </button>
  </div>

  <sc-if value="{{hasReqs}}" hint-placeholder-val="{{ true }}">
    <section aria-label="Solicitudes" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700">Solicitudes ({{reqCount}})</h2>
      <sc-for list="{{reqs}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid rgba(17, 17, 20, 0.08); border-radius: 16px; padding: 7px 7px 7px 10px">
          <div style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: {{r.avatar}}; border: 1px solid rgba(17, 17, 20, 0.08); box-sizing: border-box; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">{{r.initials}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <a href="PerfilOtro.dc.html" style="font-weight: 700; font-size: 15px; color: #111114">{{r.name}}</a>
            <span style="font-size: 12px; color: #5B5B66; font-weight: 500">{{r.sub}}</span>
          </div>
          <button type="button" onClick="{{r.reject}}" aria-label="Rechazar a {{r.name}}" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(17, 17, 20, 0.08); background: #FFFFFF; color: #111114; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button type="button" onClick="{{r.accept}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(17, 17, 20, 0.08); background: #3D3BD4; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Aceptar</button>
        </div>
      </sc-for>
    </section>
  </sc-if>

  <section aria-label="Cerca ahora" style="display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700">Cerca ahora</h2>
      <a href="Mapa.dc.html" style="font-size: 13px; font-weight: 700; padding: 4px 0">Ver en el mapa</a>
    </div>
    <sc-for list="{{near}}" as="f" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid #EEEEF2">
        <div style="flex: none; position: relative; width: 44px; height: 44px">
          <div style="width: 44px; height: 44px; border-radius: 50%; background: {{f.avatar}}; border: 1px solid rgba(17, 17, 20, 0.08); box-sizing: border-box; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">{{f.initials}}</div>
          <span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: #2BB673; border: 1px solid rgba(17, 17, 20, 0.08); box-sizing: border-box"></span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-weight: 700; font-size: 15px">{{f.name}}</span>
          <span style="font-size: 12px; color: #5B5B66; font-weight: 500">{{f.sub}}</span>
        </div>
        <span style="flex: none; background: #FFFFFF; border: 1px solid rgba(17, 17, 20, 0.08); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700">{{f.dist}}</span>
      </div>
    </sc-for>
  </section>

  <section aria-label="En pausa" style="display: flex; flex-direction: column; gap: 2px">
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700">En pausa</h2>
    <div style="display: flex; align-items: center; gap: 12px; padding: 7px 0">
      <div style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #ECECF0; border: 1.5px dashed #C9C9D4; box-sizing: border-box; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">LE</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-weight: 700; font-size: 15px">Leo</span>
        <span style="font-size: 12px; color: #5B5B66; font-weight: 500">Ubicación en pausa</span>
      </div>
    </div>
  </section>

  <nav aria-label="Navegación principal" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 68px; background: #FFFFFF; border: 1px solid rgba(17, 17, 20, 0.08); border-radius: 22px; box-shadow: 0 10px 30px rgba(17, 17, 20, 0.10); display: flex; justify-content: space-around; align-items: center; padding: 0 4px; box-sizing: border-box">
    <a href="Feed.dc.html" style="width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5B5B66; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M3 7v10M21 7v10"/></svg>
      Explorar
    </a>
    <a href="Mapa.dc.html" style="width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5B5B66; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
      Mapa
    </a>
    <a href="Publicar.dc.html" aria-label="Publicar plan" style="width: 50px; height: 50px; border-radius: 16px; background: #111114; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="Amigos.dc.html" aria-current="page" style="width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #3D3BD4; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.8.3 5 2.4 5 5.8"/></svg>
      Amigos
    </a>
    <a href="Perfil.dc.html" style="width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5B5B66; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      Perfil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { gone: {} };
  }
  renderVals() {
    var self = this;
    var gone = (this.state && this.state.gone) || {};
    var all = [
      { id: 'pau', name: 'Pau', initials: 'PA', avatar: '#D6EBFF', sub: '@pau.mtz · 3 amigos en común' },
      { id: 'beto', name: 'Beto', initials: 'BE', avatar: '#FFE1CF', sub: '@betogdl · 1 amigo en común' }
    ];
    var reqs = all.filter(function (r) { return !gone[r.id]; }).map(function (r) {
      function drop() { var g = {}; for (var k in gone) { g[k] = gone[k]; } g[r.id] = true; self.setState({ gone: g }); }
      return { name: r.name, initials: r.initials, avatar: r.avatar, sub: r.sub, accept: drop, reject: drop };
    });
    var near = [
      { name: 'Sofi', initials: 'SO', avatar: '#FFEDB8', sub: 'Café · hace 5 min', dist: '~800 m' },
      { name: 'Dani', initials: 'DA', avatar: '#E3DFFF', sub: 'Comer · hace 2 min', dist: '~1 km' },
      { name: 'Mau', initials: 'MA', avatar: '#CDEFDF', sub: 'Correr · hace 12 min', dist: '~3 km' }
    ];
    return { reqs: reqs, reqCount: reqs.length, hasReqs: reqs.length > 0, near: near };
  }
}
</script>
</body>
</html>
