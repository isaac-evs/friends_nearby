    <span style="width: 48px; height: 48px; border-radius: 50%; background: #CDEFDF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; border: 3px solid {{ringMau}}; box-shadow: 0 6px 18px rgba(17, 17, 20, 0.08); box-sizing: border-box">MA</span>

  <button type="button" aria-label="Centrar en mi ubicación" style="position: absolute; right: 16px; top: 458px; width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(17, 17, 20, 0.08); background: #FFFFFF; color: #3D3BD4; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(17, 17, 20, 0.08)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>

  <section aria-label="Seleccionado en el mapa" style="position: absolute; left: 12px; right: 12px; bottom: 92px; height: 236px; background: #FFFFFF; border: 1px solid rgba(17, 17, 20, 0.08); border-radius: 24px; box-shadow: 0 10px 30px rgba(17, 17, 20, 0.10); box-sizing: border-box; padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 10px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

      <a href="{{sel.ctaHref}}" style="height: 46px; border-radius: 14px; background: #3D3BD4; color: #FFFFFF; border: 1px solid rgba(17, 17, 20, 0.08); box-shadow: 0 6px 18px rgba(17, 17, 20, 0.08); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none">{{sel.cta}}</a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">

      <span style="font-size: 12px; color: #5B5B66; font-weight: 500">Círculo = zona aproximada. Exacta solo con match.</span>
    </div>

  <nav aria-label="Navegación principal" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 68px; background: #FFFFFF; border: 1px solid rgba(17, 17, 20, 0.08); border-radius: 22px; box-shadow: 0 10px 30px rgba(17, 17, 20, 0.10); display: flex; justify-content: space-around; align-items: center; padding: 0 4px; box-sizing: border-box">
    <a href="Feed.dc.html" style="width: 60px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5B5B66; text-decoration: none; font-size: 11px; font-weight: 700">

  </nav>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'sofi', filter: 'Todos' };
  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var approx = { badge: 'Aprox.', badgeBg: '#F1F1F4', badgeFg: '#111114', sec: 'Ver plan', secHref: 'Feed.dc.html', cta: 'Jalo', ctaHref: 'Match.dc.html', radius: '50%' };
    function mk(base, extra) { var o = {}; var k; for (k in base) { o[k] = base[k]; } for (k in extra) { o[k] = extra[k]; } return o; }
    var items = {
      sofi: mk(approx, { name: 'Sofi', initials: 'SO', avatar: '#FFEDB8', category: 'Café', where: 'Av. Providencia y Rubén Darío', ago: 'en vivo', title: 'Por un café en Providencia, ¿alguien?', badge: 'Exacta', badgeBg: '#3D3BD4', badgeFg: '#FFFFFF', cta: 'Cómo llegar' }),
      dani: mk(approx, { name: 'Dani', initials: 'DA', avatar: '#E3DFFF', category: 'Comer', where: 'a ~1 km · Chapultepec', ago: 'hace 2 min', title: 'Tortas ahogadas, voy saliendo' }),
      regina: mk(approx, { name: 'Regina', initials: 'RE', avatar: '#FFDDE8', category: 'Estudiar', where: 'a ~1.5 km · Providencia', ago: 'hace 9 min', title: 'Repaso para el parcial en la biblio' }),
      mau: mk(approx, { name: 'Mau', initials: 'MA', avatar: '#CDEFDF', category: 'Correr', where: 'a ~3 km · Colomos', ago: 'hace 12 min', title: '5 km suavecito en el Metropolitano' }),
      run: mk(approx, { name: 'Social Run 5K', initials: '5K', avatar: '#FF7A45', radius: '14px', category: 'Evento', where: 'Bosque Los Colomos', ago: 'sáb 7:00', title: '34 van · 3 amigos tuyos · cupo 50', badge: 'Público', badgeBg: '#CDEFDF', badgeFg: '#111114', sec: 'Ver evento', secHref: 'Evento.dc.html', cta: 'Me uno', ctaHref: 'Evento.dc.html' })
    };
    var sel = s.sel || 'sofi';
    function ring(id) { return sel === id ? '#3D3BD4' : '#FFFFFF'; }
    function pick(id) { return function () { self.setState({ sel: id }); }; }
    var filters = ['Todos', 'Amigos', 'Eventos'].map(function (l) {
      var on = (s.filter || 'Todos') === l;
      return { label: l, pressed: on ? 'true' : 'false', bg: on ? '#3D3BD4' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111114', pick: function () { self.setState({ filter: l }); } };
    });
    return {
      sel: items[sel],
      filters: filters,
      ringSofi: ring('sofi'), ringDani: ring('dani'), ringRegina: ring('regina'), ringMau: ring('mau'), ringRun: ring('run'),
      selSofi: pick('sofi'), selDani: pick('dani'), selRegina: pick('regina'), selMau: pick('mau'), selRun: pick('run')
    };
  }
}
</script>
